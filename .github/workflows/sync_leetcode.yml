name: Sync Leetcode

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 6"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch and Write Submissions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          LEETCODE_USERNAME: "ARISTA2"
        run: |
          python - << 'EOF'
          import os, sys, json, time, re, requests
          from pathlib import Path

          session = os.environ.get("LEETCODE_SESSION")
          csrf = os.environ.get("LEETCODE_CSRF_TOKEN")
          username = os.environ.get("LEETCODE_USERNAME")

          if not session or not csrf or not username:
              print(" Missing credentials or username.")
              sys.exit(1)

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Referer": "https://leetcode.com",
              "Cookie": f"LEETCODE_SESSION={session}; csrftoken={csrf}",
              "x-csrftoken": csrf,
              "Content-Type": "application/json"
          }

          GRAPHQL_URL = "https://leetcode.com/graphql"

          # 1. Fetch recent accepted submissions
          list_query = """
          query recentAcSubmissions($username: String!, $limit: Int!) {
              recentAcSubmissionList(username: $username, limit: $limit) {
                  id
                  title
                  titleSlug
                  timestamp
              }
          }
          """

          resp = requests.post(GRAPHQL_URL, json={"query": list_query, "variables": {"username": username, "limit": 20}}, headers=headers)
          if resp.status_code != 200:
              print(f" Failed to fetch submission list: {resp.status_code}")
              sys.exit(1)

          submissions = resp.json().get("data", {}).get("recentAcSubmissionList", [])
          print(f"🔍 Found {len(submissions)} accepted submissions for '{username}'.")

          dest_dir = Path("leetcode-problems")
          dest_dir.mkdir(parents=True, exist_ok=True)

          ext_map = {
              "python3": "py", "python": "py", "java": "java", "cpp": "cpp", 
              "c": "c", "javascript": "js", "typescript": "ts", "golang": "go",
              "rust": "rs", "mysql": "sql", "mssql": "sql", "csharp": "cs"
          }

          detail_query = """
          query submissionDetails($submissionId: Int!) {
              submissionDetails(submissionId: $submissionId) {
                  code
                  lang {
                      name
                  }
                  question {
                      questionId
                      titleSlug
                  }
              }
          }
          """

          saved_count = 0
          seen_slugs = set()

          for sub in submissions:
              sub_id = int(sub["id"])
              slug = sub["titleSlug"]

              if slug in seen_slugs:
                  continue
              seen_slugs.add(slug)

              print(f"⏳ Processing: {slug} (ID: {sub_id})...", end=" ")

              code_text = None
              lang_ext = "py"
              q_num = "0000"

              # Try GraphQL submissionDetails
              d_resp = requests.post(
                  GRAPHQL_URL, 
                  json={"query": detail_query, "variables": {"submissionId": sub_id}}, 
                  headers=headers
              )

              if d_resp.status_code == 200:
                  d_json = d_resp.json()
                  d_data = d_json.get("data", {}).get("submissionDetails")
                  if d_data and d_data.get("code"):
                      code_text = d_data["code"]
                      lang_name = d_data.get("lang", {}).get("name", "py").lower()
                      lang_ext = ext_map.get(lang_name, lang_name)
                      q_num = d_data.get("question", {}).get("questionId", "0000")

              # Fallback: Scrape from submission detail page directly
              if not code_text:
                  page_resp = requests.get(f"https://leetcode.com/submissions/detail/{sub_id}/", headers=headers)
                  if page_resp.status_code == 200:
                      match = re.search(r"submissionCode\s*:\s*['\"](.*?)['\"],\s*\n", page_resp.text)
                      if match:
                          try:
                              code_text = bytes(match.group(1), "utf-8").decode("unicode_escape")
                          except Exception:
                              code_text = match.group(1)

              if code_text:
                  folder_name = f"{slug}"
                  prob_dir = dest_dir / folder_name
                  prob_dir.mkdir(parents=True, exist_ok=True)

                  out_file = prob_dir / f"solution.{lang_ext}"
                  out_file.write_text(code_text, encoding="utf-8")
                  print(f" Saved ({out_file.name})")
                  saved_count += 1
              else:
                  print("Code not found.")

              time.sleep(0.4)

          print(f"\n Successfully saved {saved_count} solutions.")
          EOF

      - name: Commit and Push Solutions
        run: |
          git config user.name "ARYISTA"
          git config user.email "aryabist74@gmail.com"
          git add leetcode-problems/
          git status
          if git diff --staged --quiet; then
            echo "No changes detected to commit."
          else
            git commit -m "sync: leetcode accepted submissions [skip ci]"
            git push origin HEAD
          fi
