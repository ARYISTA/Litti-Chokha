name: Sync Leetcode

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 6"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch Recent Submissions & Commit
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          GIT_AUTHOR_NAME: "ARYISTA"
          GIT_AUTHOR_EMAIL: "202307020014@karnavatiuniversity.edu.in"
        run: |
          python - << 'EOF'
          import os, sys, requests, json
          from pathlib import Path

          session = os.environ.get("LEETCODE_SESSION")
          csrf = os.environ.get("LEETCODE_CSRF_TOKEN")

          if not session or not csrf:
              print("Missing credentials.")
              sys.exit(1)

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Referer": "https://leetcode.com",
              "Cookie": f"LEETCODE_SESSION={session}; csrftoken={csrf}",
              "x-csrftoken": csrf
          }

          # Query LeetCode GraphQL
          query = {
              "query": """
              query recentAcSubmissions($username: String!, $limit: Int!) {
                  recentAcSubmissionList(username: $username, limit: $limit) {
                      id
                      title
                      titleSlug
                      timestamp
                  }
              }
              """,
              "variables": {"username": "ARYISTA", "limit": 20}
          }

          resp = requests.post("https://leetcode.com/graphql", json=query, headers=headers)
          print(f"Status: {resp.status_code}")
          if resp.status_code != 200:
              print(resp.text[:300])
          EOF

      - name: Commit and Push
        run: |
          git config user.name "ARYISTA"
          git config user.email "202307020014@karnavatiuniversity.edu.in"
          git add leetcode-problems/ || true
          git diff --staged --quiet || git commit -m "sync: leetcode solutions"
          git push
