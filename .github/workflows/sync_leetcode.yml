name: Sync Leetcode

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 6"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch and Commit Each Submission Individually
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          LEETCODE_USERNAME: "ARISTA2"
          GIT_AUTHOR_NAME: "ARYISTA"
          GIT_AUTHOR_EMAIL: "aryabist74@gmail.com"
        run: |
          # Git author setup
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          python - << 'EOF'
          import os, sys, json, time, re, subprocess, requests
          from datetime import datetime
          from pathlib import Path

          session = os.environ.get("LEETCODE_SESSION")
          csrf = os.environ.get("LEETCODE_CSRF_TOKEN")
          username = os.environ.get("LEETCODE_USERNAME")
          author_email = os.environ.get("GIT_AUTHOR_EMAIL")
          author_name = os.environ.get("GIT_AUTHOR_NAME")

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Referer": "https://leetcode.com",
              "Cookie": f"LEETCODE_SESSION={session}; csrftoken={csrf}",
              "x-csrftoken": csrf,
              "Content-Type": "application/json"
          }

          GRAPHQL_URL = "https://leetcode.com/graphql"

          # 1. Fetch recent accepted submissions
          list_query = """
          query recentAcSubmissions($username: String!, $limit: Int!) {
              recentAcSubmissionList(username: $username, limit: $limit) {
                  id
                  title
                  titleSlug
                  timestamp
              }
          }
          """

          resp = requests.post(GRAPHQL_URL, json={"query": list_query, "variables": {"username": username, "limit": 20}}, headers=headers)
          if resp.status_code != 200:
              print(f" Failed to fetch submission list: {resp.status_code}")
              sys.exit(1)

          submissions = resp.json().get("data", {}).get("recentAcSubmissionList", [])
          print(f"🔍 Found {len(submissions)} accepted submissions.")

          dest_dir = Path("leetcode-problems")
          dest_dir.mkdir(parents=True, exist_ok=True)

          ext_map = {
              "python3": "py", "python": "py", "java": "java", "cpp": "cpp", 
              "c": "c", "javascript": "js", "typescript": "ts", "golang": "go",
              "rust": "rs", "mysql": "sql", "mssql": "sql", "csharp": "cs"
          }

          detail_query = """
          query submissionDetails($submissionId: Int!) {
              submissionDetails(submissionId: $submissionId) {
                  code
                  lang {
                      name
                  }
                  question {
                      questionId
                      titleSlug
                  }
              }
          }
          """

          # Reverse submissions so oldest commits happen first (maintaining true timeline)
          submissions.reverse()
          new_commits = 0

          for sub in submissions:
              sub_id = int(sub["id"])
              slug = sub["titleSlug"]
              sub_title = sub["title"]
              sub_timestamp = int(sub["timestamp"])
              commit_date = datetime.fromtimestamp(sub_timestamp).isoformat()

              code_text = None
              lang_ext = "py"

              # Fetch code
              d_resp = requests.post(
                  GRAPHQL_URL, 
                  json={"query": detail_query, "variables": {"submissionId": sub_id}}, 
                  headers=headers
              )

              if d_resp.status_code == 200:
                  d_data = d_resp.json().get("data", {}).get("submissionDetails")
                  if d_data and d_data.get("code"):
                      code_text = d_data["code"]
                      lang_name = d_data.get("lang", {}).get("name", "py").lower()
                      lang_ext = ext_map.get(lang_name, lang_name)

              # Fallback scrape
              if not code_text:
                  page_resp = requests.get(f"https://leetcode.com/submissions/detail/{sub_id}/", headers=headers)
                  if page_resp.status_code == 200:
                      match = re.search(r"submissionCode\s*:\s*['\"](.*?)['\"],\s*\n", page_resp.text)
                      if match:
                          try:
                              code_text = bytes(match.group(1), "utf-8").decode("unicode_escape")
                          except Exception:
                              code_text = match.group(1)

              if not code_text:
                  continue

              prob_dir = dest_dir / slug
              prob_dir.mkdir(parents=True, exist_ok=True)
              out_file = prob_dir / f"solution.{lang_ext}"
              out_file.write_text(code_text, encoding="utf-8")

              # Stage only this file
              subprocess.run(["git", "add", str(out_file)], check=True)

              # Check if this file actually has changes
              diff_check = subprocess.run(["git", "diff", "--staged", "--quiet"])
              if diff_check.returncode != 0:
                  # Environment variables for exact submission date
                  env_vars = os.environ.copy()
                  env_vars["GIT_AUTHOR_DATE"] = commit_date
                  env_vars["GIT_COMMITTER_DATE"] = commit_date

                  commit_msg = f"solve: {slug} - {sub_title} [LeetCode Submission #{sub_id}]"
                  commit_res = subprocess.run(
                      ["git", "commit", "-m", commit_msg],
                      env=env_vars,
                      capture_output=True,
                      text=True
                  )
                  if commit_res.returncode == 0:
                      print(f" Committed: {slug} (Dated: {commit_date})")
                      new_commits += 1

              time.sleep(0.4)

          print(f"\n Done! Created {new_commits} individual commits.")
          EOF

      - name: Push All Individual Commits
        run: |
          git push origin HEAD
