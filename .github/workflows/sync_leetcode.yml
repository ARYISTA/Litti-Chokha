name: Sync Leetcode

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 6"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests

      - name: Sync Each Submission Individually
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          LEETCODE_USERNAME: "ARISTA2"
          GIT_AUTHOR_NAME: "ARYISTA"
          GIT_AUTHOR_EMAIL: "aryabist74@gmail.com"
        run: |
          git config --global user.name "$GIT_AUTHOR_NAME"
          git config --global user.email "$GIT_AUTHOR_EMAIL"

          python - << 'EOF'
          import os, sys, time, subprocess, requests
          from datetime import datetime, timezone
          from pathlib import Path

          session = os.environ.get("LEETCODE_SESSION")
          csrf = os.environ.get("LEETCODE_CSRF_TOKEN")
          username = os.environ.get("LEETCODE_USERNAME")
          author_email = os.environ.get("GIT_AUTHOR_EMAIL")
          author_name = os.environ.get("GIT_AUTHOR_NAME")

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Referer": "https://leetcode.com",
              "Cookie": f"LEETCODE_SESSION={session}; csrftoken={csrf}",
              "x-csrftoken": csrf,
              "Content-Type": "application/json"
          }

          GRAPHQL_URL = "https://leetcode.com/graphql"

          list_query = """
          query recentAcSubmissions($username: String!, $limit: Int!) {
              recentAcSubmissionList(username: $username, limit: $limit) {
                  id
                  title
                  titleSlug
                  timestamp
              }
          }
          """

          resp = requests.post(
              GRAPHQL_URL,
              json={"query": list_query, "variables": {"username": username, "limit": 50}},
              headers=headers
          )
          if resp.status_code != 200:
              print(f" List fetch failed: HTTP {resp.status_code}")
              sys.exit(1)

          submissions = resp.json().get("data", {}).get("recentAcSubmissionList", [])
          print(f" Found {len(submissions)} accepted submissions.")

          detail_query = """
          query submissionDetails($submissionId: Int!) {
              submissionDetails(submissionId: $submissionId) {
                  code
                  lang {
                      name
                  }
                  question {
                      questionFrontendId
                      titleSlug
                  }
              }
          }
          """

          ext_map = {
              "python3": "py", "python": "py", "java": "java", "cpp": "cpp",
              "c": "c", "javascript": "js", "typescript": "ts", "golang": "go",
              "rust": "rs", "mysql": "sql", "mssql": "sql", "csharp": "cs"
          }

          dest_dir = Path("leetcode-problems")
          dest_dir.mkdir(parents=True, exist_ok=True)

          submissions.reverse()
          commit_count = 0

          for sub in submissions:
              sub_id = int(sub["id"])
              slug = sub["titleSlug"]
              sub_title = sub["title"]
              sub_time = int(sub["timestamp"])
              commit_date = datetime.fromtimestamp(sub_time, tz=timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')

              d_resp = requests.post(
                  GRAPHQL_URL,
                  json={"query": detail_query, "variables": {"submissionId": sub_id}},
                  headers=headers
              )

              if d_resp.status_code != 200:
                  print(f" HTTP {d_resp.status_code} for {slug}")
                  continue

              d_json = d_resp.json()
              if "errors" in d_json:
                  print(f" GraphQL Error for {slug}: {d_json['errors'][0].get('message')}")
                  continue

              d_data = d_json.get("data", {}).get("submissionDetails")
              if not d_data or not d_data.get("code"):
                  print(f" Null code for {slug} (Check if LEETCODE_SESSION expired)")
                  continue

              code_text = d_data["code"]
              lang_name = d_data.get("lang", {}).get("name", "py").lower()
              lang_ext = ext_map.get(lang_name, lang_name)
              q_id = str(d_data.get("question", {}).get("questionFrontendId", "0000")).zfill(4)

              prob_dir = dest_dir / f"{q_id}-{slug}"
              prob_dir.mkdir(parents=True, exist_ok=True)
              out_file = prob_dir / f"solution.{lang_ext}"
              out_file.write_text(code_text, encoding="utf-8")

              subprocess.run(["git", "add", str(out_file)], check=True)

              env = os.environ.copy()
              env["GIT_AUTHOR_NAME"] = author_name
              env["GIT_AUTHOR_EMAIL"] = author_email
              env["GIT_COMMITTER_NAME"] = author_name
              env["GIT_COMMITTER_EMAIL"] = author_email
              env["GIT_AUTHOR_DATE"] = commit_date
              env["GIT_COMMITTER_DATE"] = commit_date

              commit_msg = f"solve: {q_id}-{slug} ({sub_title}) [#{sub_id}]"
              res = subprocess.run(["git", "commit", "-m", commit_msg], env=env, capture_output=True, text=True)

              if res.returncode == 0:
                  print(f" Committed: {q_id}-{slug} ({commit_date})")
                  commit_count += 1

              time.sleep(0.3)

          print(f"\n Total individual commits created: {commit_count}")
          EOF

      - name: Push All Commits
        run: git push origin HEAD
