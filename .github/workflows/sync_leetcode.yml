name: Sync Leetcode

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 6"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch and Write Submissions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          LEETCODE_USERNAME: "ARISTA2" # Aapka LeetCode username
        run: |
          python - << 'EOF'
          import os, sys, json, time, requests
          from pathlib import Path

          session = os.environ.get("LEETCODE_SESSION")
          csrf = os.environ.get("LEETCODE_CSRF_TOKEN")
          username = os.environ.get("LEETCODE_USERNAME")

          if not session or not csrf:
              print("Missing secrets.")
              sys.exit(1)

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Referer": "https://leetcode.com",
              "Cookie": f"LEETCODE_SESSION={session}; csrftoken={csrf}",
              "x-csrftoken": csrf,
              "Content-Type": "application/json"
          }

          GRAPHQL_URL = "https://leetcode.com/graphql"

          # 1. Fetch recent accepted submissions
          query = """
          query recentAcSubmissions($username: String!, $limit: Int!) {
              recentAcSubmissionList(username: $username, limit: $limit) {
                  id
                  title
                  titleSlug
                  timestamp
              }
          }
          """

          resp = requests.post(GRAPHQL_URL, json={"query": query, "variables": {"username": username, "limit": 20}}, headers=headers)
          if resp.status_code != 200:
              print(f"Failed to fetch list: {resp.status_code}")
              sys.exit(1)

          submissions = resp.json().get("data", {}).get("recentAcSubmissionList", [])
          print(f"Found {len(submissions)} accepted submissions.")

          dest_dir = Path("leetcode-problems")
          dest_dir.mkdir(parents=True, exist_ok=True)

          # 2. Fetch code for each submission
          detail_query = """
          query submissionDetails($submissionId: Int!) {
              submissionDetail(submissionId: $submissionId) {
                  code
                  lang {
                      name
                  }
                  question {
                      questionFrontendId
                      titleSlug
                  }
              }
          }
          """

          ext_map = {"python3": "py", "python": "py", "java": "java", "cpp": "cpp", "c": "c", "javascript": "js", "typescript": "ts"}
          saved = 0

          for item in submissions:
              sub_id = int(item["id"])
              d_resp = requests.post(GRAPHQL_URL, json={"query": detail_query, "variables": {"submissionId": sub_id}}, headers=headers)
              
              if d_resp.status_code == 200:
                  d_data = d_resp.json().get("data", {}).get("submissionDetail")
                  if d_data and d_data.get("code"):
                      q_num = d_data["question"]["questionFrontendId"]
                      slug = d_data["question"]["titleSlug"]
                      lang = d_data["lang"]["name"].lower()
                      ext = ext_map.get(lang, "txt")

                      folder = dest_dir / f"{q_num.zfill(4)}-{slug}"
                      folder.mkdir(parents=True, exist_ok=True)

                      file_path = folder / f"solution.{ext}"
                      file_path.write_text(d_data["code"], encoding="utf-8")
                      print(f"Saved: {file_path}")
                      saved += 1
                      time.sleep(0.3)

          print(f"Completed! Total saved: {saved}")
          EOF

      - name: Commit and Push
        run: |
          git config user.name "ARYISTA"
          # Make sure this matches your primary verified GitHub email to get green dots:
          git config user.email "aryabist74@gmail.com"
          git add leetcode-problems/
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "sync: leetcode accepted submissions"
            git push origin HEAD
          fi
